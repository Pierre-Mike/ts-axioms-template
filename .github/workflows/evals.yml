name: agent-evals

# Weekly golden-task agent evals (see evals/README.md): headless `claude -p`
# attempts each task in a throwaway worktree and the repo's own gates judge
# the result. Measures whether the template still steers agents to the
# canonical shape. No-ops when the ANTHROPIC_API_KEY secret is absent.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: run golden tasks
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not configured — skipping agent evals."
            exit 0
          fi
          ./evals/run.sh
