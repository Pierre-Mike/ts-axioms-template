name: mutation

# Weekly mutation testing (StrykerJS, command runner over `bun test`) on the
# pure cores. Catches vacuous tests — suites that pass while asserting
# nothing — which AI-generated code is especially prone to. Scheduled, not
# per-PR: mutation runs are expensive.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:mutation
