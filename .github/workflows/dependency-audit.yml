name: dependency-audit

# Daily known-vulnerability scan of the lockfile on main. The `audit` CI gate
# is event-driven (PR / push), so advisories published against code that did
# not change stay invisible until someone happens to open a PR: this repo went
# 2.5 quiet weeks and accumulated 16 advisories — one critical — before a
# routine PR tripped over them. New advisories arrive on the world's clock,
# not the repo's, so the check belongs on a clock too.
#
# Renovate raises the fix PRs (see renovate.json), but only for DIRECT
# dependencies — it dropped npm transitive remediation in v38, and the bun
# manager has no lockfile-remediation path at all. Transitively vulnerable
# packages are therefore this job's job: it fails, a human adds a
# package.json `overrides` entry, and Renovate keeps that entry fresh.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # NOT named `audit`: the four job names in ci.yml are a contract with the
  # ruleset's required checks (.github/rulesets/main.json).
  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # Red X on main + GitHub's scheduled-failure notification. Note that
      # GitHub disables cron workflows after 60 days of repo inactivity.
      - run: bun audit
