name: bootstrap

# Self-applies the branch ruleset (.github/rulesets/main.json) the first time
# the template is pushed to main, then guards itself from ever running again.
#
# After a "Use this template" the new repo has no protection yet; this workflow
# closes that gap with zero manual steps. It runs only on push to main and only
# when a ruleset named "main-branch-protection" does not already exist, so once
# the ruleset is in place subsequent pushes short-circuit immediately.
#
# Manual fallback: if Actions lacks the required permission (org policy), run
# .github/scripts/apply-ruleset.sh locally with an admin token.
on:
  push:
    branches: [main]

permissions:
  contents: read
  # Managing repository rulesets via the REST API requires admin; on
  # user-owned repos the default GITHUB_TOKEN can manage them with this scope.
  administration: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  apply-ruleset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if ruleset already exists (self-guard)
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="$(jq -r .name .github/rulesets/main.json)"
          existing="$(gh api "repos/${{ github.repository }}/rulesets" \
            --jq ".[] | select(.name == \"$name\") | .id" 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "Ruleset '$name' already present (id=$existing) — nothing to do."
            echo "apply=false" >> "$GITHUB_OUTPUT"
          else
            echo "apply=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply ruleset
        if: steps.guard.outputs.apply == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/rulesets" \
            --input .github/rulesets/main.json
          echo "Applied main-branch-protection ruleset."
