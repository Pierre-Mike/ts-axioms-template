name: release-please

# Release automation over conventional commits (enforced by the lefthook
# commit-msg gate): maintains a release PR with changelog + version bump;
# merging it tags a GitHub release.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          release-type: simple
