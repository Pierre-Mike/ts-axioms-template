# Single git-hook runner (replaces husky + lint-staged). Wired by
# `bun install` -> `prepare` -> `lefthook install`.
#
# Bypass everything:  LEFTHOOK=0 git ...   or   git ... --no-verify

pre-commit:
  piped: true # run in order, abort on first failure
  jobs:
    # lint-staged equivalent: auto-fix staged files with Biome, then re-stage
    # the fixes so they land in the same commit (no second commit).
    - name: biome
      glob: "*.{ts,tsx,js,jsx,json,jsonc}"
      run: bunx biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    # Conventional-commit gate (machine-readable history; feeds release-please).
    - name: conventional-commit
      run: bun run scripts/check-commit-msg.ts {1}

pre-push:
  piped: true
  jobs:
    # Fallow full-repo audit (dead code, duplication, circular deps,
    # complexity). Whole-graph, not diff-scoped: dead exports and cycles are
    # global properties a changed-files view can miss.
    - name: audit
      run: bun run audit
    # Type gate across the workspace solution. Delegates to the same
    # `bun run typecheck` (`tsc -b`) the CI `typecheck` job runs — one source of
    # truth. (`tsc -b --noEmit` is illegal in build mode: composite project
    # references may not disable emit, TS6310.)
    - name: typecheck
      run: bun run typecheck
